<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>스케줄</title>
<link rel="manifest" href="manifest.json">
<style>

*{box-sizing:border-box}
:root{--blue:#1976d2;--blue-soft:#eaf3ff;--text:#202124;--muted:#8b9199;--line:#edf0f3}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#eef1f5;color:var(--text)}
body{padding-bottom:env(safe-area-inset-bottom)}
.app{max-width:720px;margin:auto;min-height:100vh;background:#fff;position:relative;padding-bottom:78px}
header{padding:14px 16px 10px;position:sticky;top:0;background:#fff;z-index:10;border-bottom:1px solid var(--line)}
.brand-row{display:flex;align-items:center;gap:9px}
.brand-icon{width:26px;height:26px;border:2px solid var(--blue);border-radius:7px;color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
h1{font-size:19px;margin:0;font-weight:750;letter-spacing:-.3px}
.excel-btn{margin-left:auto;border:1px solid #dfe4e9;background:#f7f9fb;color:#4f5964;border-radius:8px;padding:5px 8px;font-size:10px;font-weight:700;display:flex;gap:3px;align-items:center;cursor:pointer}.excel-btn span{font-size:10px}.settings-btn{border:0;background:transparent;font-size:20px;color:#69717b;padding:4px;cursor:pointer}
.date{color:#777;font-size:12px;margin-top:5px}
.quick-add{display:flex;gap:7px;padding:11px 12px 7px;background:#fff}
.quick-add input{flex:1;min-width:0;height:38px;border:1px solid #e1e5ea;border-radius:8px;padding:0 12px;font-size:12px;outline:none;background:#fafbfc}
.quick-add input:focus{border-color:#9fc5ef;background:#fff}
.quick-add button{width:46px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:700;font-size:12px}
.tabs{display:flex;gap:7px;padding:4px 12px 11px;overflow:auto;background:#fff;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:#f2f4f7;color:#555d66;padding:7px 12px;border-radius:18px;white-space:nowrap;font-size:11px}
.tabs button.active{background:var(--blue);color:#fff}
.chip-count{font-size:9px;margin-left:2px;opacity:.75}
main{padding:14px 12px}
.card{border:1px solid #e5e8ec;border-radius:11px;padding:11px;margin-bottom:8px;background:#fff;box-shadow:0 1px 2px #00000008}
.card.overdue{border-color:#e57373;background:#fffafa}
.row{display:flex;gap:9px;align-items:flex-start}
.check{width:19px;height:19px;margin-top:2px;accent-color:var(--blue)}
.title{font-weight:650;flex:1;font-size:13px;line-height:1.35}.done{text-decoration:line-through;color:#999}
.meta{font-size:10px;color:#777;margin-top:5px}
.badge{display:inline-block;padding:3px 6px;border-radius:7px;background:#f2f4f6;margin-right:4px}
.actions{display:flex;gap:5px;margin-top:8px}.actions button{border:1px solid #e1e4e8;background:#fff;border-radius:7px;padding:5px 7px;font-size:10px;color:#555}
.fab{position:fixed;right:18px;bottom:74px;border:0;border-radius:50%;width:52px;height:52px;font-size:25px;background:var(--blue);color:white;box-shadow:0 5px 18px #1976d244;z-index:20}
.empty{text-align:center;color:#a0a6ad;padding:70px 10px 90px;font-size:11px;line-height:1.7}
.empty:before{content:"✓";display:flex;width:55px;height:55px;margin:0 auto 14px;border:2px solid #cbd3dd;border-radius:12px;align-items:center;justify-content:center;font-size:25px;color:#aeb7c2}
dialog{width:min(92%,520px);border:0;border-radius:18px;padding:0;box-shadow:0 10px 50px #0004}
form{padding:20px} label{display:block;font-size:13px;margin:12px 0 5px;color:#555}
input,textarea,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;font:inherit}
textarea{min-height:80px;resize:vertical}.form-actions{display:flex;gap:8px;margin-top:18px}.form-actions button{flex:1;padding:11px;border:0;border-radius:10px}
.save{background:#202124;color:#fff}.cancel{background:#eee}

/* 달력 */
.calendar-wrap{padding:4px 0 20px}
.calendar-head{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px}
.calendar-head strong{font-size:18px}
.calendar-nav{display:flex;gap:5px}
.calendar-nav button{border:1px solid #ddd;background:#fff;border-radius:8px;height:32px;padding:0 10px;font-size:14px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.weekday{text-align:center;font-size:10px;color:#8a919a;padding:5px 0}
.day{min-height:55px;border:1px solid #eef0f2;border-radius:9px;background:#fff;padding:6px;cursor:pointer}
.day.muted{color:#c4c8cd;background:#fafafa}
.day.today{border:2px solid var(--blue)}
.day.selected{background:var(--blue);color:#fff}
.day-num{font-size:12px;font-weight:650}
.day-dots{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
.day-dot{width:5px;height:5px;border-radius:50%;background:#777}
.day.selected .day-dot{background:#fff}
.calendar-selected{margin-top:16px}
.calendar-selected h3{margin:0 0 9px;font-size:15px}
.calendar-empty{text-align:center;color:#999;padding:24px 10px;border:1px dashed #ddd;border-radius:10px;font-size:11px}
.calendar-task{border:1px solid #e4e5e7;border-radius:10px;padding:10px;margin-bottom:7px}
.calendar-task .ct-title{font-weight:650;font-size:12px}.calendar-task.done-task .ct-title{text-decoration:line-through;color:#999}
.calendar-task .ct-meta{font-size:10px;color:#777;margin-top:4px}
.calendar-actions{display:flex;gap:5px;margin-top:7px}.calendar-actions button{border:1px solid #ddd;background:#fff;border-radius:7px;padding:5px 7px;font-size:10px}
.calendar-add{width:100%;border:0;border-radius:9px;background:#f0f3f6;padding:10px;margin-top:8px;font-weight:650;font-size:11px}
.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(720px,100%);height:68px;padding:7px 10px calc(7px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid #e6e9ed;display:flex;justify-content:space-around;z-index:15}
.bottom-item{border:0;background:transparent;color:#9098a2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;min-width:60px}
.bottom-item.active{color:var(--blue);font-weight:700}
.nav-icon{font-size:19px;line-height:20px}
@media (min-width:900px){
 body{padding:24px}
 .app{max-width:1180px;min-height:calc(100vh - 48px);border-radius:18px;box-shadow:0 4px 25px #0001;overflow:hidden}
 header{padding:18px 28px 12px}
 .quick-add{padding:12px 28px 8px}.tabs{padding:4px 28px 12px}
 main{padding:24px 28px 90px}.bottom-nav{width:1180px;max-width:calc(100% - 48px);border-radius:0 0 18px 18px}
 .day{min-height:92px;padding:9px}.calendar-grid{gap:7px}
}


/* 구매관리 */
.purchase-quick-add{background:#f7fbff;border-bottom:1px solid var(--line)}
.purchase-quick-add input{border-color:#cfe1f5;background:#fff}
.purchase-quick-add button{background:#18a66a}
.purchase-home{padding:0 0 20px}
.purchase-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.purchase-stat{border:1px solid #e5e8ec;border-radius:10px;padding:9px 7px;text-align:center;background:#fff}
.purchase-stat strong{display:block;font-size:17px}.purchase-stat span{font-size:9px;color:#777}
.purchase-filter{display:flex;gap:6px;margin-bottom:10px;overflow:auto}.purchase-filter button{border:0;background:#f2f4f7;border-radius:17px;padding:7px 11px;font-size:10px;white-space:nowrap}.purchase-filter button.active{background:var(--blue);color:#fff}
.purchase-search{width:100%;height:38px;border:1px solid #e1e5ea;border-radius:9px;padding:0 11px;font-size:11px;margin-bottom:10px}
.purchase-card{border:1px solid #e2e6ea;border-radius:11px;padding:11px;margin-bottom:8px;background:#fff;box-shadow:0 1px 2px #00000008;cursor:pointer}
.purchase-card.pending{border-color:#f0d58a}.purchase-card.done{border-color:#b9dfc7;background:#fcfffd}
.purchase-card-top{display:flex;align-items:flex-start;gap:7px}.purchase-title{font-weight:700;font-size:13px;flex:1}.purchase-status{font-size:9px;border-radius:10px;padding:4px 7px;background:#fff1c7;color:#8a6500;white-space:nowrap}.purchase-status.done{background:#dcf5e5;color:#18733d}
.purchase-meta{font-size:10px;color:#777;margin-top:6px;line-height:1.5}.purchase-items{font-size:10px;color:#555;margin-top:6px;padding-top:6px;border-top:1px solid #f0f1f2}
.purchase-actions{display:flex;gap:6px;margin-top:9px}.purchase-actions button{flex:1;border:1px solid #dfe3e7;background:#fff;border-radius:8px;padding:7px;font-size:10px}.purchase-actions .primary{background:var(--blue);border-color:var(--blue);color:#fff}
.purchase-fab{position:fixed;right:18px;bottom:136px;border:0;border-radius:50%;width:48px;height:48px;font-size:23px;background:#18a66a;color:#fff;box-shadow:0 5px 18px #18a66a44;z-index:20}
.item-row{display:grid;grid-template-columns:1fr 72px 86px 30px;gap:5px;margin-bottom:6px;align-items:center}.item-row input{padding:9px;font-size:11px}.item-row button{height:36px;border:1px solid #ddd;background:#fff;border-radius:8px;font-size:15px}
.total-box{background:#f5f8fb;border-radius:9px;padding:10px;text-align:right;font-size:12px;font-weight:700;margin-top:8px}
.photo-box{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.photo-thumb{position:relative;border-radius:9px;overflow:hidden;border:1px solid #ddd;aspect-ratio:1}.photo-thumb img{width:100%;height:100%;object-fit:cover}.photo-remove{position:absolute;right:4px;top:4px;width:23px;height:23px;border:0;border-radius:50%;background:#0008;color:#fff}
.purchase-detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.purchase-detail-title{font-size:18px;font-weight:750}.detail-section{margin-top:16px}.detail-section h3{font-size:13px;margin:0 0 7px}.detail-info{border:1px solid #e5e8ec;border-radius:10px;padding:10px;font-size:11px;line-height:1.8}.share-note{background:#fff8db;border:1px solid #f2dfa0;border-radius:9px;padding:9px;font-size:10px;color:#735b00;margin-top:9px}
@media (min-width:900px){.purchase-fab{right:45px}.purchase-summary{max-width:520px}.purchase-card{padding:14px}}

</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand-row"><div class="brand-icon" id="brandIcon">✓</div><h1 id="pageTitle">스케줄</h1><button class="excel-btn" id="excelBtn" aria-label="엑셀로 저장">⇩<span>엑셀</span></button><button class="settings-btn" id="settingsBtn" aria-label="설정">⚙</button></div>
  <div class="date" id="todayText"></div>
</header>
<div class="quick-add" id="scheduleQuickAdd">
  <input id="quickTitle" type="text" placeholder="할 일을 입력하세요..." autocomplete="off">
  <button id="quickAddBtn">추가</button>
</div>
<div class="quick-add purchase-quick-add" id="purchaseQuickAdd" style="display:none">
  <input id="quickPurchaseTitle" type="text" placeholder="구매할 품목을 입력하세요... (Enter)" autocomplete="off">
  <button id="quickPurchaseAddBtn">추가</button>
</div>
<nav class="tabs" id="scheduleTabs">
  <button data-filter="all">전체 <span class="chip-count" id="allCount">0</span></button>
  <button data-filter="today" class="active">오늘 <span class="chip-count" id="todayCount">0</span></button>
  <button data-filter="doing">진행 중 <span class="chip-count" id="doingCount">0</span></button>
  <button data-filter="done">완료 <span class="chip-count" id="doneCount">0</span></button>
</nav>
<main id="list"></main>

<div id="purchaseView" style="display:none">
  <div class="purchase-home">
    <div class="purchase-summary">
      <div class="purchase-stat"><strong id="purchaseAllCount">0</strong><span>전체</span></div>
      <div class="purchase-stat"><strong id="purchasePendingCount">0</strong><span>입고 대기</span></div>
      <div class="purchase-stat"><strong id="purchaseDoneCount">0</strong><span>입고 완료</span></div>
    </div>
    <div class="purchase-filter">
      <button class="active" data-pfilter="all">전체</button>
      <button data-pfilter="pending">입고 대기</button>
      <button data-pfilter="done">입고 완료</button>
    </div>
    <input class="purchase-search" id="purchaseSearch" placeholder="품목명, 구매처, 담당자 검색...">
    <div id="purchaseList"></div>
  </div>
</div>

<div id="calendarView" style="display:none"></div>
<div id="flowGuide" style="padding:0 16px 18px;color:#777;font-size:12px;text-align:center">
① 예정 → ② 진행 중 → ③ 완료
</div>
<button class="fab" id="addBtn" aria-label="할 일 추가">＋</button>
<nav class="bottom-nav" id="bottomNav">
  <button class="bottom-item active" data-nav="today"><span class="nav-icon">▣</span><span>스케줄</span></button>
  <button class="bottom-item" data-nav="purchase"><span class="nav-icon">🛒</span><span>구매관리</span></button>
  <button class="bottom-item" data-nav="calendar"><span class="nav-icon">□</span><span>달력</span></button>
  <button class="bottom-item" data-nav="done"><span class="nav-icon">✓</span><span>완료</span></button>
  <button class="bottom-item" data-nav="all"><span class="nav-icon">☰</span><span>전체</span></button>
</nav>
</div>

<dialog id="dlg">
<form id="taskForm">
<h2 id="dialogTitle">할 일 추가</h2>
<input type="hidden" id="taskId">
<label>할 일</label><input id="title" required placeholder="예: 자동차 부품 주문">
<label>날짜</label><input id="date" type="date" required>
<label>시간</label><input id="time" type="time">
<label>상태</label>
<select id="status"><option value="todo">① 예정</option><option value="doing">② 진행 중</option><option value="done">③ 완료</option></select>
<label>중요도</label>
<select id="priority"><option value="normal">보통</option><option value="high">중요</option><option value="low">낮음</option></select>
<label>메모</label><textarea id="memo" placeholder="메모를 입력하세요"></textarea>
<div class="form-actions"><button type="button" class="cancel" id="cancelBtn">취소</button><button class="save">저장</button></div>
</form>
</dialog>



<button class="purchase-fab" id="purchaseAddBtn" style="display:none" aria-label="구매요청 등록">＋</button>

<dialog id="purchaseDlg">
<form id="purchaseForm">
<h2 id="purchaseDialogTitle">구매요청 등록</h2>
<input type="hidden" id="purchaseId">
<label>구매요청 제목</label><input id="purchaseTitle" required placeholder="예: 생산기술팀 공구 구매">
<label>구매처</label><input id="purchaseVendor" placeholder="예: 온라인 / 업체명">
<label>구매 담당자</label><input id="purchaseManager" placeholder="카톡으로 공유할 담당자 이름">
<label>요청일</label><input id="purchaseDate" type="date" required>
<label>구매 품목</label>
<div id="purchaseItems"></div>
<button type="button" class="calendar-add" id="addPurchaseItemBtn">＋ 품목 추가</button>
<div class="total-box">총 금액 <span id="purchaseTotal">0</span>원</div>
<label>메모</label><textarea id="purchaseMemo" placeholder="구매요청 관련 메모"></textarea>
<div class="form-actions"><button type="button" class="cancel" id="purchaseCancelBtn">취소</button><button type="button" id="purchaseDeleteBtn" style="display:none;background:#fff;border:1px solid #e35b5b;color:#c62828">삭제</button><button class="save">등록하기</button></div>
</form>
</dialog>

<dialog id="receiptDlg">
<form id="receiptForm">
<h2>입고 처리</h2>
<input type="hidden" id="receiptId">
<label>입고일</label><input id="receiptDate" type="date" required>
<label>입고 수량</label><input id="receiptQty" type="number" min="0" step="1" placeholder="입고된 수량">
<label>입고 사진</label>
<input id="receiptPhoto" type="file" accept="image/*" capture="environment" multiple>
<div id="receiptPreview" class="photo-box"></div>
<label>입고 메모</label><textarea id="receiptMemo" placeholder="정상 입고 확인 등"></textarea>
<div class="form-actions"><button type="button" class="cancel" id="receiptCancelBtn">취소</button><button class="save">입고 완료</button></div>
</form>
</dialog>

<dialog id="purchaseDetailDlg">
<div style="padding:20px">
<div class="purchase-detail-head"><div><div class="purchase-detail-title" id="detailTitle"></div><div class="meta" id="detailStatus"></div></div><button type="button" class="cancel" id="detailCloseBtn" style="padding:7px 10px;border:0;border-radius:8px">닫기</button></div>
<div class="detail-section"><h3>구매 정보</h3><div class="detail-info" id="detailInfo"></div></div>
<div class="detail-section"><h3>품목</h3><div class="detail-info" id="detailItems"></div></div>
<div class="detail-section" id="detailPhotoSection" style="display:none"><h3>입고 사진</h3><div class="photo-box" id="detailPhotos"></div></div>
<div class="share-note">입고 완료 후 <b>카톡 공유</b>를 누르면 메시지를 먼저 클립보드에 복사한 뒤 휴대폰 공유 화면을 엽니다. 카카오톡이 문구를 자동 입력하지 않는 경우 <b>붙여넣기</b>로 바로 입력할 수 있습니다.</div>
<div class="purchase-actions"><button type="button" id="detailEditBtn">수정</button><button type="button" class="primary" id="detailReceiptBtn">입고 처리</button><button type="button" id="detailShareBtn">💬 카톡 공유</button><button type="button" id="detailCopyBtn">📋 메시지 복사</button><button type="button" id="detailDeleteBtn" style="border-color:#e35b5b;color:#c62828">삭제</button></div>
</div>
</dialog>

<script>
const KEY="myTodoTasksV1";
let tasks=JSON.parse(localStorage.getItem(KEY)||"[]");
const PURCHASE_KEY="myPurchasesV1";
let purchases=JSON.parse(localStorage.getItem(PURCHASE_KEY)||"[]");
let purchaseFilter="all";
let purchaseSearch="";
let receiptPhotos=[];
let currentPurchaseId="";
let filter="today";
let calendarDate=new Date();
let selectedDate=today();

const $=id=>document.getElementById(id);
function today(){return new Date().toISOString().slice(0,10)}
function save(){localStorage.setItem(KEY,JSON.stringify(tasks));render()}
function fmtDate(s){if(!s)return"";const d=new Date(s+"T00:00:00");return `${d.getMonth()+1}월 ${d.getDate()}일`}
function priorityText(p){return p==="high"?"중요":p==="low"?"낮음":"보통"}
function visible(){
 const t=today();
 if(filter==="today")return tasks.filter(x=>x.date===t&&x.status!=="done");
 if(filter==="doing")return tasks.filter(x=>x.status==="doing");
 if(filter==="done")return tasks.filter(x=>x.status==="done");
 return tasks;
}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}


function updateCounts(){
  $("allCount").textContent=tasks.length;
  $("todayCount").textContent=tasks.filter(x=>x.date===today()).length;
  $("doingCount").textContent=tasks.filter(x=>x.status==="doing").length;
  $("doneCount").textContent=tasks.filter(x=>x.status==="done").length;
}

function render(){
 updateCounts();
 const d=new Date();
 const isPurchase=filter==="purchase";
 // 화면별 상단 제목/아이콘
 $("pageTitle").textContent=isPurchase?"구매등록":"스케줄";
 $("brandIcon").textContent=isPurchase?"🛒":"✓";
 $("purchaseView").style.display=isPurchase?"block":"none";
 $("purchaseAddBtn").style.display=isPurchase?"block":"none";
 $("addBtn").style.display=isPurchase?"none":"block";
 $("scheduleQuickAdd").style.display=isPurchase?"none":"flex";
 $("purchaseQuickAdd").style.display=isPurchase?"flex":"none";
 $("scheduleTabs").style.display=isPurchase?"none":"flex";
 if(isPurchase){$("list").style.display="none";$("calendarView").style.display="none";renderPurchases();return}
 $("todayText").textContent=d.toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
 const cal=filter==="calendar";
 $("list").style.display=cal?"none":"block";
 $("calendarView").style.display=cal?"block":"none";
 if(cal){renderCalendar();return}

 const arr=visible().sort((a,b)=>{
  // 완료: 실제 완료 처리 시각이 최신인 일정부터
  if(filter==="done"){
    return (Number(b.updatedAt)||0)-(Number(a.updatedAt)||0);
  }
  // 전체 / 오늘 / 진행 중: 일정 날짜와 시간이 최신인 것부터
  const ad=(a.date||"0000-00-00")+" "+(a.time||"00:00");

 });

   <div class="row">

    <div style="flex:1">
     <div class="title ${x.status==="done"?"done":""}">${esc(x.title)}</div>
     <div class="meta">
      <span class="badge">${fmtDate(x.date)}${x.time?" "+x.time:""}</span>

      <span class="badge">${x.status==="doing"?"② 진행 중":x.status==="done"?"③ 완료":"① 예정"}</span>
      ${overdue?'<span class="badge">처리 진행 중</span>':""}
     </div>
     ${x.memo?`<div class="meta">${esc(x.memo)}</div>`:""}
     <div class="actions">
      <button data-next="${x.id}">${x.status==="todo"?"② 진행 시작":x.status==="doing"?"③ 완료 처리":"↩ ① 예정으로"}</button>
      <button data-edit="${x.id}">수정</button><button data-del="${x.id}">삭제</button>
     </div>
    </div>
   </div>`;
  $("list").appendChild(card);
 });
}

async function copyPurchaseMessage(id,show=true){
 const x=purchases.find(p=>p.id===id);if(!x)return false;
 const text=getPurchaseShareText(x);
 try{
  if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);}
  else{const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.focus();ta.select();document.execCommand("copy");ta.remove();}
  if(show)alert("입고 완료 메시지가 복사되었습니다.\n카카오톡에서 붙여넣어 보내세요.");
  return true;
 }catch(e){if(show)alert("메시지 복사에 실패했습니다. 다시 시도해 주세요.");return false;}
}
async function sharePurchase(id){
 const x=purchases.find(p=>p.id===id);if(!x)return;
 const photos=x.photos||[];const text=getPurchaseShareText(x);
 try{
  // 카카오톡이 Web Share의 text 값을 무시하는 경우를 대비해 먼저 메시지를 클립보드에 저장합니다.
  await copyPurchaseMessage(id,false);
  if(navigator.share){
   const files=[];
   for(let i=0;i<photos.length;i++){
    try{
     const p=photos[i];
     const blob=await (await fetch(p.data)).blob();
     files.push(new File([blob],p.name||`입고사진${i+1}.jpg`,{type:p.type||blob.type||"image/jpeg"}));
    }catch(e){}
   }
   const canShareFiles=files.length&&navigator.canShare&&navigator.canShare({files});
   if(canShareFiles) await navigator.share({title:"구매품 입고 완료",text,files});
   else await navigator.share({title:"구매품 입고 완료",text});
  }else{
   alert("이 기기에서는 공유 기능을 지원하지 않습니다.\n입고 완료 메시지가 클립보드에 복사되었습니다. 카카오톡에서 붙여넣어 보내세요.");
  }
 }catch(e){
  if(e.name!=="AbortError")alert("공유를 취소했거나 현재 기기에서 공유를 지원하지 않습니다.\n메시지는 클립보드에 복사되어 있습니다.");
 }
}

function renderCalendar(){
 const y=calendarDate.getFullYear(),m=calendarDate.getMonth();
 const first=new Date(y,m,1),last=new Date(y,m+1,0);
 const start=first.getDay(),days=last.getDate();
 let html=`<div class="calendar-wrap">
  <div class="calendar-head"><strong>${y}년 ${m+1}월</strong>
   <div class="calendar-nav"><button id="calPrev">‹</button><button id="calToday">오늘</button><button id="calNext">›</button></div>
  </div>
  <div class="calendar-grid">
   ${["일","월","화","수","목","금","토"].map(x=>`<div class="weekday">${x}</div>`).join("")}`;
 const prevLast=new Date(y,m,0).getDate();
 for(let i=start-1;i>=0;i--)html+=`<div class="day muted"><div class="day-num">${prevLast-i}</div></div>`;
 for(let day=1;day<=days;day++){
  const ds=`${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
  const n=tasks.filter(x=>x.date===ds).length;
  const cls=["day",ds===today()?"today":"",ds===selectedDate?"selected":""].filter(Boolean).join(" ");
  html+=`<div class="${cls}" data-date="${ds}"><div class="day-num">${day}</div>
   ${n?`<div class="day-dots">${Array(Math.min(n,5)).fill('<span class="day-dot"></span>').join("")}</div>`:""}
  </div>`;
 }
 const trailing=(7-((start+days)%7))%7;
 for(let day=1;day<=trailing;day++)html+=`<div class="day muted"><div class="day-num">${day}</div></div>`;
 html+=`</div><div class="calendar-selected">${renderSelectedDay(selectedDate)}</div></div>`;
 $("calendarView").innerHTML=html;

 $("calPrev").onclick=()=>{calendarDate=new Date(y,m-1,1);renderCalendar()};
 $("calNext").onclick=()=>{calendarDate=new Date(y,m+1,1);renderCalendar()};
 $("calToday").onclick=()=>{const d=new Date();calendarDate=new Date(d.getFullYear(),d.getMonth(),1);selectedDate=today();renderCalendar()};
 document.querySelectorAll("#calendarView .day[data-date]").forEach(el=>el.onclick=()=>{selectedDate=el.dataset.date;renderCalendar()});
 const add=$("calendarAddBtn");if(add)add.onclick=()=>openAdd(selectedDate);
 document.querySelectorAll("[data-cal-edit]").forEach(b=>b.onclick=()=>openEdit(b.dataset.calEdit));
 document.querySelectorAll("[data-cal-del]").forEach(b=>b.onclick=()=>{if(confirm("이 할 일을 삭제할까요?")){tasks=tasks.filter(x=>x.id!==b.dataset.calDel);save()}});
 document.querySelectorAll("[data-cal-next]").forEach(b=>b.onclick=()=>{const x=tasks.find(t=>t.id===b.dataset.calNext);if(x){x.status=x.status==="todo"?"doing":x.status==="doing"?"done":"todo";save()}});
}

function renderSelectedDay(ds){
 const arr=tasks.filter(x=>x.date===ds).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
 let html=`<h3>${fmtDate(ds)} 일정 <span class="count">${arr.length}건</span></h3>`;
 if(!arr.length)html+=`<div class="calendar-empty">등록된 일정이 없습니다.</div>`;
 else arr.forEach(x=>{html+=`
  <div class="calendar-task ${x.status==="done"?"done-task":""}">
   <div class="ct-title">${x.status==="done"?"☑":"☐"} ${esc(x.title)}</div>
   <div class="ct-meta">${x.time?x.time+" · ":""}${priorityText(x.priority)} · ${x.status==="doing"?"진행 중":x.status==="done"?"완료":"예정"}</div>
   ${x.memo?`<div class="ct-meta">${esc(x.memo)}</div>`:""}
   <div class="calendar-actions">
    <button data-cal-next="${x.id}">${x.status==="todo"?"진행 시작":x.status==="doing"?"완료 처리":"예정으로"}</button>
    <button data-cal-edit="${x.id}">수정</button><button data-cal-del="${x.id}">삭제</button>
   </div>
  </div>`});
 html+=`<button class="calendar-add" id="calendarAddBtn">＋ ${fmtDate(ds)} 일정 추가</button>`;
 return html;
}

$("excelBtn").onclick=exportToExcel;

function createQuickTask(openEditAfter=false){
  const input=$("quickTitle");
  const title=input.value.trim();
  if(!title){input.focus();return}

  const id=crypto.randomUUID();
  tasks.push({
    id:id,
    title:title,
    date:today(),
    time:"",
    status:"todo",
    priority:"normal",
    memo:"",
    updatedAt:Date.now()
  });

  input.value="";
  save();

  if(openEditAfter){
    openEdit(id);
  }else{
    input.focus();
  }
}

$("quickAddBtn").onclick=()=>createQuickTask(false);

$("quickTitle").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    createQuickTask(true);
  }
});

$("quickPurchaseAddBtn").onclick=()=>createQuickPurchase(true);
$("quickPurchaseTitle").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    createQuickPurchase(true);
  }
});

document.querySelectorAll(".bottom-item").forEach(btn=>{
  btn.onclick=()=>{
    const nav=btn.dataset.nav;
    document.querySelectorAll(".bottom-item").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    if(nav==="purchase"){
      filter="purchase";
    }else if(nav==="calendar"){
      filter="calendar";
    }else{
      filter=nav;
    }
    document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.filter===filter));
    render();
    window.scrollTo({top:0,behavior:"smooth"});
  };
});

document.getElementById("purchaseView").addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.pfilter){purchaseFilter=b.dataset.pfilter;renderPurchases();return}
 if(b.dataset.pdetail){openPurchaseDetail(b.dataset.pdetail);return}
 if(b.dataset.preceipt){openReceipt(b.dataset.preceipt);return}
 if(b.dataset.pshare){sharePurchase(b.dataset.pshare);return}
});
$("purchaseForm").addEventListener("submit",e=>{
 e.preventDefault();
 const rows=[...document.querySelectorAll("#purchaseItems .item-row")];
 const items=rows.map(r=>({name:r.querySelector(".pi-name").value.trim(),qty:r.querySelector(".pi-qty").value,unit:"EA",amount:r.querySelector(".pi-amount").value})).filter(i=>i.name);
 if(!items.length){alert("구매 품목을 1개 이상 입력해주세요.");return}
 const id=$("purchaseId").value||crypto.randomUUID();const old=purchases.find(p=>p.id===id);
 const obj={id,title:$("purchaseTitle").value.trim(),vendor:$("purchaseVendor").value.trim(),manager:$("purchaseManager").value.trim(),requestDate:$("purchaseDate").value,items,memo:$("purchaseMemo").value.trim(),status:old?.status||"pending",receiptDate:old?.receiptDate||"",receiptQty:old?.receiptQty||"",receiptMemo:old?.receiptMemo||"",photos:old?.photos||[],updatedAt:Date.now()};
 if(!obj.title){alert("구매요청 제목을 입력해주세요.");return}
 const idx=purchases.findIndex(p=>p.id===id);if(idx>=0)purchases[idx]=obj;else purchases.push(obj);
 $("purchaseDlg").close();savePurchases();
});
